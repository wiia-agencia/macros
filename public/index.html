   Color: la interfaz es tinta sobre neutros fríos. El color lo ponen solo los macros.
   Tipo: Bricolage Grotesque para cifras y títulos; Figtree para lo demás. Alineado a la izquierda. */
:root {
  --fondo: #E8ECF1;           /* cabecera y fondo de pantalla */
  --exterior: #D6DCE4;        /* lo que rodea a la app en pantallas anchas */
  --hoja: #FFFFFF;            /* hoja de contenido */
  --hundido: #EFF2F6;         /* campos, pistas, huecos */
  --linea: #DDE3EA;
  --tinta: #14181F;
  --tinta-2: #55606F;
  --tinta-3: #8792A2;
  --cima-tinta: #14181F;      /* texto sobre la cabecera */
  --cima-tinta-2: #55606F;
  --cima-hueco: rgb(20 24 31 / .07);
  --accion: #14181F;          /* botón principal */
  --accion-tinta: #FFFFFF;
  --accion-canto: #000000;
  --p: #2A78D6;               /* proteína */
  --h: #EB6834;               /* hidratos */
  --g: #1BAF7A;               /* grasa */
  --plato-luz: #FFFFFF; --plato: #F4F6F9; --hondo-a: #E9EDF2; --hondo-b: #FCFDFE; --pista: #DFE5EC; --plato-filo: rgb(255 255 255 / .9);
  --aviso-fondo: #FFF3D1; --aviso-tinta: #6B4700;
  --medias: #E3A008;          /* un día a medias */
  --sombra: 16 24 40;
  --titulo: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --texto: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
:root[data-aspecto="oscuro"] {
  --fondo: #0D0F13; --exterior: #050608; --hoja: #171A20; --hundido: #21252D; --linea: #2B313B;
  --tinta: #F2F4F7; --tinta-2: #A9B2BF; --tinta-3: #77818F;
  --cima-tinta: #F2F4F7; --cima-tinta-2: #A9B2BF; --cima-hueco: rgb(255 255 255 / .09);
  --accion: #F2F4F7; --accion-tinta: #14181F; --accion-canto: #AEB6C2;
  --p: #3987E5; --h: #D95926; --g: #199E70;
  --plato-luz: #343A45; --plato: #252A33; --hondo-a: #15181D; --hondo-b: #232830; --pista: #333944; --plato-filo: rgb(255 255 255 / .12);
  --aviso-fondo: #3A2E0B; --aviso-tinta: #FFD877;
  --sombra: 0 0 0;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--exterior); color: var(--tinta); font: 400 15px/1.4 var(--texto); -webkit-font-smoothing: antialiased; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 3px solid var(--p); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

/* ── Marco de la app ─────────────────────────────── */
.app { position: relative; height: 100%; max-width: 470px; margin: 0 auto; background: var(--fondo); display: flex; flex-direction: column; overflow: hidden; overflow: clip; }
@media (min-width: 560px) and (min-height: 760px) {
  .app { height: min(100% - 32px, 900px); margin: 16px auto; border-radius: 34px; box-shadow: 0 30px 80px rgb(var(--sombra) / .28), 0 0 0 1px rgb(var(--sombra) / .08); }
}
.pantallas { position: relative; flex: 1; min-height: 0; }
.pantalla { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; display: none; flex-direction: column; scrollbar-width: none; }
.pantalla::-webkit-scrollbar { display: none; }
.pantalla.activa { display: flex; animation: entra .22s ease-out; }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } }

/* ── Cabecera ────────────────────────────────────── */
.cima { padding: 16px 18px 18px; color: var(--cima-tinta); flex: none; }
.cima-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.cima h1 { font: 700 28px/1.05 var(--titulo); letter-spacing: -.02em; }
.cima-sub { color: var(--cima-tinta-2); margin-top: 6px; max-width: 34ch; }
.cima-botones { display: flex; gap: 8px; }
.redondo { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--cima-hueco); color: var(--cima-tinta); transition: transform .12s; }
.redondo:active { transform: scale(.92); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── El plato (resumen) ──────────────────────────── */
.resumen { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; align-items: center; margin-top: 14px; }
.plato { position: relative; width: 150px; height: 150px; }
.plato svg { width: 100%; height: 100%; display: block; overflow: visible; filter: drop-shadow(0 12px 16px rgb(var(--sombra) / .22)) drop-shadow(0 2px 3px rgb(var(--sombra) / .14)); }
.plato .arco { fill: none; stroke-width: 12; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 80px 80px; transition: stroke-dasharray .5s cubic-bezier(.2, .8, .2, 1), stroke-dashoffset .5s cubic-bezier(.2, .8, .2, 1), opacity .25s; }
.plato .arco.p { stroke: var(--p); } .plato .arco.h { stroke: var(--h); } .plato .arco.g { stroke: var(--g); }
.plato-centro { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; color: var(--tinta); pointer-events: none; }
.plato-centro b { font: 700 38px/1 var(--titulo); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.plato-centro b.mil { font-size: 31px; }
.plato-centro span { font-size: 13px; font-weight: 600; color: var(--tinta-2); margin-top: 2px; }

.datos { display: grid; gap: 11px; }
.dato-fila { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.dato-nombre { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; color: var(--cima-tinta); }
.punto { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
[data-m="p"] .punto, .punto.p { background: var(--p); } [data-m="h"] .punto, .punto.h { background: var(--h); } [data-m="g"] .punto, .punto.g { background: var(--g); }
.dato-valor { font: 700 20px/1 var(--titulo); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dato-valor small { font: 600 12px var(--texto); color: var(--cima-tinta-2); margin-left: 2px; }
.barra { height: 7px; border-radius: 99px; background: var(--cima-hueco); margin-top: 6px; overflow: hidden; }
.barra i { display: block; height: 100%; border-radius: 99px; width: 0; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
[data-m="p"] .barra { --c: var(--p); } [data-m="h"] .barra { --c: var(--h); } [data-m="g"] .barra { --c: var(--g); }
.barra i { background: var(--c); }
/* Si sale más de lo pedido: macizo hasta lo pedido, un corte, y más claro lo que sobra */
.barra i.pasa { background: linear-gradient(90deg, var(--c) 0 calc(var(--corte) - 1.5px), transparent calc(var(--corte) - 1.5px) calc(var(--corte) + 1.5px), color-mix(in srgb, var(--c) 42%, transparent) calc(var(--corte) + 1.5px) 100%); }
.dia { margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--cima-tinta-2); }
.dia-kcal { display: block; }
.dia-macros { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 5px; font-variant-numeric: tabular-nums; }
.dia-macros .m { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.cima-fecha { font-size: 13.5px; font-weight: 600; color: var(--cima-tinta-2); display: inline-flex; align-items: baseline; gap: 5px; padding: 6px 0 6px 8px; }
.cima-fecha small { font-size: 11px; }
/* Otros días: la tira de la semana y el mes. La marca de cada día: llena = cumplido, aro ámbar = a medias, aro gris = sin apuntar. */
.semana { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 12px; }
.sem-d { display: grid; justify-items: center; gap: 5px; padding: 7px 0 8px; border-radius: 16px; font-size: 11.5px; font-weight: 700; color: var(--cima-tinta-2); }
.sem-d[aria-current="true"] { background: var(--hoja); color: var(--tinta); box-shadow: 0 2px 10px rgb(var(--sombra) / .12); }
.marca { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; position: relative; font: 700 12.5px/1 var(--texto); font-variant-numeric: tabular-nums; color: var(--tinta-2); }
.marca span { position: relative; }
.marca.ok { background: var(--tinta); color: var(--hoja); }
.marca.med { box-shadow: inset 0 0 0 2.5px var(--medias); color: var(--tinta); }
.marca.apu { box-shadow: inset 0 0 0 2.5px var(--tinta-3); color: var(--tinta); }
.marca.sin { box-shadow: inset 0 0 0 1.5px var(--tinta-3); color: var(--tinta-3); }
.marca.fut { color: var(--tinta-3); opacity: .55; }
.marca.ya { color: var(--tinta); }      /* hoy: un aro que se va llenando con lo que lleva (hueco por dentro, vale sobre cualquier fondo) */
.marca.ya::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--tinta) 0 var(--v, 0%), var(--pista) var(--v, 0%));
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px)); }
.junto { white-space: nowrap; }
.mes-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: -2px; }
.mes-nav p { font-size: 13.5px; color: var(--tinta-2); text-align: center; }
.mes-nav button { width: 38px; height: 38px; flex: none; border-radius: 50%; background: var(--hundido); font-size: 20px; line-height: 1; } .mes-nav button:disabled { opacity: .35; }
.mes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 2px; justify-items: center; margin: 12px 0 4px; }
.mes small { font-size: 11.5px; font-weight: 700; color: var(--tinta-3); padding-bottom: 2px; }
.mes-d { border-radius: 50%; } .mes-d .marca { width: 34px; height: 34px; font-size: 13.5px; }
.mes-d[aria-current="true"] .marca { outline: 2.5px solid var(--tinta); outline-offset: 2px; }
.mes-ley { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; margin-top: 14px; }
.mes-ley div { background: var(--hundido); border-radius: 16px; padding: 10px 12px; font-size: 12.5px; font-weight: 600; color: var(--tinta-2); }
.mes-ley b { display: block; font: 700 22px/1.1 var(--titulo); color: var(--tinta); margin-bottom: 3px; }
.mes-ley .marca { display: inline-block; width: 11px; height: 11px; margin-right: 5px; vertical-align: -1px; }
.racha { margin-top: 10px; background: var(--accion); color: var(--accion-tinta); border-radius: 16px; padding: 12px 14px; font-size: 14px; font-weight: 600; }

/* ── Hoja de contenido ───────────────────────────── */
.hoja { flex: 1 0 auto; background: var(--hoja); border-radius: 28px 28px 0 0; padding: 16px 16px 60px; box-shadow: 0 -8px 30px rgb(var(--sombra) / .1); }
.nota { color: var(--tinta-3); font-size: 13px; margin-top: 14px; padding: 0 4px; }
.enlace { color: var(--tinta); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* Interruptor de dos posiciones */
.modos { position: relative; display: grid; grid-template-columns: 1fr 1fr; background: var(--hundido); border-radius: 16px; padding: 4px; }
.modos::before { content: ''; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 12px; background: var(--hoja); box-shadow: 0 1px 2px rgb(var(--sombra) / .16), 0 4px 10px rgb(var(--sombra) / .1); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.modos[data-pos="1"]::before { transform: translateX(100%); }
.modos button { position: relative; height: 42px; font-weight: 700; font-size: 14.5px; color: var(--tinta-2); border-radius: 12px; transition: color .2s; }
.modos button[aria-selected="true"] { color: var(--tinta); }

/* Filas de alimento */
.filas { margin-top: 8px; }
.fila { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--linea); }
.fila:last-child { border-bottom: 0; }
.fila-txt { min-width: 0; text-align: left; display: block; width: 100%; }
.fila-nombre { font-weight: 700; font-size: 15.5px; line-height: 1.25; display: block; }
.fila-nombre i { font-style: normal; font-weight: 500; color: var(--tinta-2); }
.fila-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 9px; margin-top: 4px; font-size: 12.5px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.estado { font-size: 11.5px; font-weight: 600; color: var(--tinta-2); background: var(--hundido); padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.m { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.m .punto { width: 7px; height: 7px; }
.m.clave { color: var(--tinta); font-weight: 700; }   /* el dato por el que está ordenada la lista */
.fila.de-plato { row-gap: 6px; }
.fila.de-plato .mini { grid-row: 1 / span 2; align-self: start; }
.fila.de-plato .fila-sub { grid-column: 2 / span 2; margin-top: 0; }
.fila-kcal { text-align: right; font: 700 16px/1 var(--titulo); font-variant-numeric: tabular-nums; }
.fila-kcal small { display: block; font: 500 11px var(--texto); color: var(--tinta-3); margin-top: 3px; }
.fila-fin { display: flex; align-items: center; gap: 10px; }

/* Platito: el borde reparte las kcal del alimento entre los macros */
.mini { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; box-shadow: 0 3px 7px rgb(var(--sombra) / .16); }
.mini > span { width: 35px; height: 35px; border-radius: 50%; background: radial-gradient(circle at 35% 25%, var(--plato-luz), var(--plato)); display: grid; place-items: center; font-size: 19px; line-height: 1; box-shadow: inset 0 1px 2px rgb(var(--sombra) / .12); }
.mini > span.letra { font: 700 15px var(--titulo); color: var(--tinta-2); }
.mini.grande { width: 84px; height: 84px; } .mini.grande > span { width: 64px; height: 64px; font-size: 34px; } .mini.grande > span.letra { font-size: 26px; }

/* Báscula: − 300 g + */
.peso { display: inline-flex; align-items: center; background: var(--hundido); border-radius: 15px; padding: 3px; gap: 2px; }
.peso button { width: 31px; height: 35px; border-radius: 12px; background: var(--hoja); display: grid; place-items: center; box-shadow: 0 2px 0 rgb(var(--sombra) / .13), 0 1px 4px rgb(var(--sombra) / .1); transition: transform .08s, box-shadow .08s; touch-action: manipulation; }
.peso button:active { transform: translateY(2px); box-shadow: 0 0 0 rgb(var(--sombra) / .13); }
.peso .ico { width: 16px; height: 16px; stroke-width: 2.6; }
.peso label { display: flex; align-items: baseline; padding: 0 2px; }
.peso input { width: 42px; border: 0; background: none; text-align: right; font: 700 17px/1 var(--titulo); font-variant-numeric: tabular-nums; padding: 8px 0; outline: none; -moz-appearance: textfield; }
.peso em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--tinta-3); margin-left: 2px; }
.peso.calculado { background: none; box-shadow: inset 0 0 0 1.5px var(--linea); }
.peso.calculado.cambia { animation: latido .5s ease-out; }
@keyframes latido { 30% { box-shadow: inset 0 0 0 1.5px var(--tinta), 0 0 0 4px rgb(var(--sombra) / .08); } }
.candado { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--tinta-2); background: var(--hundido); }
.candado[aria-pressed="true"] { color: var(--accion-tinta); background: var(--accion); }
.candado .ico { width: 18px; height: 18px; }

/* Botones */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 54px; border-radius: 18px; background: var(--accion); color: var(--accion-tinta); font-weight: 700; font-size: 16px; box-shadow: 0 4px 0 var(--accion-canto), 0 12px 22px rgb(var(--sombra) / .22); transition: transform .08s, box-shadow .08s; touch-action: manipulation; }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accion-canto), 0 4px 8px rgb(var(--sombra) / .2); }
.btn.suave { background: var(--hundido); color: var(--tinta); box-shadow: 0 3px 0 var(--linea); height: 48px; font-size: 15px; }
.btn.suave:active { box-shadow: 0 0 0 var(--linea); }
.btn.peligro { color: #C2341F; }
:root[data-aspecto="oscuro"] .btn.peligro { color: #FF8A75; }
.btn-fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn.claro { background: var(--hoja); color: var(--tinta); font-size: 15px; padding: 0 16px; box-shadow: 0 4px 0 var(--linea), 0 12px 22px rgb(var(--sombra) / .18), 0 0 0 1px var(--linea); }
.btn.claro:active { box-shadow: 0 1px 0 var(--linea), 0 4px 8px rgb(var(--sombra) / .16), 0 0 0 1px var(--linea); }
.pie-botones { display: flex; gap: 10px; }
.pie-botones .btn { flex: 1 1 auto; width: auto; min-width: 0; white-space: nowrap; }
.pie-botones .btn.claro { flex: none; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.en-fila { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 3px; }
.chips.en-fila::-webkit-scrollbar { display: none; }
.chips.en-fila .chip { flex: none; }
.chip { height: 36px; padding: 0 14px; border-radius: 99px; background: var(--hundido); font-weight: 600; font-size: 13.5px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; transition: transform .1s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"], .chip.activo { background: var(--tinta); color: var(--hoja); }
.chip[aria-pressed="true"] .ico { fill: currentColor; }
.chip .ico { width: 15px; height: 15px; stroke-width: 2.4; }
.cinta { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -18px 0; padding: 0 18px 2px; }
.cinta::-webkit-scrollbar { display: none; }
.cima .chip { background: var(--cima-hueco); color: var(--cima-tinta); }
.cima .chip[aria-pressed="true"] { background: var(--cima-tinta); color: var(--fondo); }

/* Objetivo del plato (modo «pongo los macros») */
.objetivo { margin-top: 12px; display: grid; gap: 10px; }
.obj-campos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.campo-m { background: var(--hundido); border-radius: 16px; padding: 8px 12px 5px; display: block; border-bottom: 4px solid transparent; }
.campo-m[data-m="p"] { border-bottom-color: var(--p); } .campo-m[data-m="h"] { border-bottom-color: var(--h); } .campo-m[data-m="g"] { border-bottom-color: var(--g); }
.campo-m span { font-size: 12.5px; font-weight: 600; color: var(--tinta-2); display: block; }
.campo-m div { display: flex; align-items: baseline; }
.campo-m input { width: 100%; min-width: 0; border: 0; background: none; outline: none; font: 700 23px/1.15 var(--titulo); font-variant-numeric: tabular-nums; padding: 2px 0; }
.campo-m em { font-style: normal; font-weight: 600; color: var(--tinta-3); font-size: 13px; }
.rotulo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 2px 4px 0; }
.rotulo, .rotulo h3 { font: 700 13.5px/1.2 var(--texto); color: var(--tinta-2); }
h3.rotulo { display: block; margin-top: 8px; }
.rotulo h3 b { color: var(--tinta); }
#obj-chips .aviso-ej { margin-top: 0; }
.tamanos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; background: var(--hundido); border-radius: 14px; padding: 4px; }
.tamanos button { height: 36px; font-weight: 700; font-size: 13.5px; color: var(--tinta-2); border-radius: 10px; transition: background .2s, color .2s; }
.tamanos button[aria-pressed="true"] { background: var(--hoja); color: var(--tinta); box-shadow: 0 1px 2px rgb(var(--sombra) / .16), 0 4px 10px rgb(var(--sombra) / .1); }
.tamanos + .chips { margin-top: 8px; }
.obj-kcal { font-weight: 700; color: var(--tinta); font-variant-numeric: tabular-nums; }
.veredicto { border-radius: 18px; padding: 13px 14px; background: var(--hundido); display: grid; gap: 9px; }
.veredicto.bien { background: var(--accion); color: var(--accion-tinta); display: flex; align-items: center; gap: 10px; padding: 11px 14px; }
.veredicto.bien .ico { width: 20px; height: 20px; stroke-width: 2.6; }
.veredicto.ojo { background: var(--aviso-fondo); color: var(--aviso-tinta); }
.veredicto h3 { font: 700 16px/1.25 var(--texto); display: flex; align-items: center; gap: 8px; }
.veredicto p { font-size: 13.5px; line-height: 1.4; }
.v-lineas { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13.5px; line-height: 1.4; }
.v-lineas li { display: grid; grid-template-columns: 9px minmax(0, 1fr); gap: 9px; align-items: baseline; }
.v-lineas .punto { width: 9px; height: 9px; }
.v-que { font-weight: 600; }
.veredicto .chip { background: var(--hoja); color: var(--tinta); box-shadow: 0 2px 0 rgb(var(--sombra) / .14); }
.aviso-ej .chip { background: var(--hoja); color: var(--tinta); box-shadow: 0 2px 0 rgb(var(--sombra) / .14); flex: none; }
.aviso-ej { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; padding: 9px 9px 9px 14px; border-radius: 16px; background: var(--hundido); font-size: 13.5px; font-weight: 600; color: var(--tinta-2); }

/* Buscador */
.buscador { position: relative; margin-top: 14px; }
.buscador .ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--tinta-3); pointer-events: none; }
.buscador input { width: 100%; height: 50px; border-radius: 16px; border: 0; background: var(--hoja); color: var(--tinta); padding: 0 16px 0 46px; font-size: 16px; font-weight: 500; outline: none; box-shadow: 0 2px 0 rgb(var(--sombra) / .08), 0 6px 16px rgb(var(--sombra) / .08); -webkit-appearance: none; appearance: none; }
.buscador input::placeholder { color: var(--tinta-3); }
.buscador input:focus-visible { outline: 3px solid var(--p); outline-offset: 0; }
.sheet .buscador input { background: var(--hundido); box-shadow: none; }
.orden { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 4px 4px; color: var(--tinta-3); font-size: 13px; }
.orden select { max-width: 64%; border: 0; background: var(--hundido); border-radius: 10px; padding: 7px 10px; font-weight: 600; font-size: 13px; color: var(--tinta); }
.anadir { width: 40px; height: 40px; border-radius: 14px; background: var(--hundido); display: grid; place-items: center; box-shadow: 0 2px 0 var(--linea); transition: transform .08s, box-shadow .08s, background .2s, color .2s; }
.anadir:active { transform: translateY(2px); box-shadow: none; }
.anadir.puesto { background: var(--accion); color: var(--accion-tinta); box-shadow: 0 2px 0 var(--accion-canto); }
.anadir .ico { width: 18px; height: 18px; stroke-width: 2.5; }
.vacio { text-align: left; padding: 22px 6px; color: var(--tinta-2); }
.vacio b { display: block; color: var(--tinta); font: 700 18px var(--titulo); margin-bottom: 4px; }

/* Mis macros */
.form { display: grid; gap: 14px; margin-top: 16px; }
.form-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.campo { background: var(--hundido); border-radius: 16px; padding: 10px 12px 8px; display: block; }
.campo span { font-size: 12.5px; font-weight: 600; color: var(--tinta-2); display: block; }
.campo div { display: flex; align-items: baseline; gap: 4px; }
.campo input { width: 100%; min-width: 0; border: 0; background: none; outline: none; font: 700 24px/1.2 var(--titulo); font-variant-numeric: tabular-nums; padding: 2px 0; }
.campo input[type="text"].largo { font: 600 17px/1.4 var(--texto); }
.campo em { font-style: normal; font-weight: 600; color: var(--tinta-3); font-size: 13px; white-space: nowrap; }
.campo:focus-within, .campo-m:focus-within { box-shadow: 0 0 0 2px var(--tinta); }
.subtitulo { font: 700 17px/1.2 var(--titulo); margin: 22px 4px 0; }
.actividad { background: var(--hundido); border-radius: 16px; padding: 12px 14px 14px; }
.actividad b { display: block; font-size: 15.5px; }
.actividad small { color: var(--tinta-2); font-size: 13px; }
.actividad input[type="range"] { width: 100%; margin: 12px 0 0; accent-color: var(--tinta); height: 28px; }
.metas { display: grid; gap: 10px; margin-top: 12px; }
.meta { position: relative; text-align: left; background: var(--hundido); border-radius: 20px; padding: 14px 15px 13px; display: grid; gap: 10px; box-shadow: 0 3px 0 var(--linea); transition: transform .08s, box-shadow .12s, background .2s, color .2s; }
.meta:active { transform: translateY(2px); }
.meta[aria-pressed="true"] { background: var(--accion); color: var(--accion-tinta); box-shadow: 0 4px 0 var(--accion-canto), 0 12px 22px rgb(var(--sombra) / .2); }
.meta-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.meta-nombre { display: block; font: 700 19px/1.1 var(--titulo); }
.meta-ritmo { display: block; font-size: 13px; opacity: .72; margin-top: 4px; }
.meta-kcal { font: 700 27px/1 var(--titulo); letter-spacing: -.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.meta-kcal small { font: 600 12px var(--texto); opacity: .7; margin-left: 3px; }
.meta-macros { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.meta-macros .punto { width: 8px; height: 8px; }
.meta-ok { position: absolute; top: -7px; right: -5px; width: 24px; height: 24px; border-radius: 50%; background: var(--hoja); color: var(--tinta); display: none; place-items: center; box-shadow: 0 0 0 2px var(--accion), 0 3px 8px rgb(var(--sombra) / .25); }
.meta[aria-pressed="true"] .meta-ok { display: grid; }
.meta-ok .ico { width: 14px; height: 14px; stroke-width: 3; }
.aviso { background: var(--aviso-fondo); color: var(--aviso-tinta); border-radius: 16px; padding: 12px 14px; font-size: 13.5px; margin-top: 12px; }
.linea-dato { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--hundido); border-radius: 16px; padding: 10px 10px 10px 14px; margin-top: 12px; }
.linea-dato b { display: block; } .linea-dato small { color: var(--tinta-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.linea-dato.toca { width: 100%; text-align: left; }
.pildora { flex: none; height: 38px; padding: 0 15px; border-radius: 13px; background: var(--hoja); font-weight: 700; font-size: 13.5px; display: grid; place-items: center; box-shadow: 0 2px 0 rgb(var(--sombra) / .13), 0 1px 4px rgb(var(--sombra) / .1); }
/* El peso: apuntarlo, cómo va (una línea, con el primero y el último rotulados) y la lista */
.kg-pon { display: grid; gap: 10px; }
.kg-campo { display: flex; align-items: baseline; justify-content: center; gap: 6px; background: var(--hundido); border-radius: 20px; padding: 12px 14px 14px; }
.kg-campo input { width: 3.4em; border: 0; background: none; outline: none; text-align: right; color: var(--tinta); font: 700 46px/1.1 var(--titulo); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kg-campo input::placeholder { color: var(--tinta-3); }
.kg-campo em { font-style: normal; font-weight: 600; font-size: 18px; color: var(--tinta-2); }
.kg-resumen { font: 700 19px/1.2 var(--titulo); margin: 20px 4px 0; }
#kg-grafica { display: block; width: 100%; height: auto; margin-top: 2px; touch-action: pan-y; cursor: crosshair; }
.kg-linea { fill: none; stroke: var(--tinta); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.kg-pt { fill: var(--tinta); stroke: var(--hoja); stroke-width: 2; } .kg-pt.chico { stroke-width: 1; }
.kg-guia { stroke: var(--tinta-3); stroke-width: 1; stroke-dasharray: 2 3; }
.kg-sel { fill: var(--hoja); stroke: var(--tinta); stroke-width: 2.5; }
.kg-rot { font: 600 12px/1 var(--texto); fill: var(--tinta-2); font-variant-numeric: tabular-nums; }
.kg-lectura { font-size: 13px; color: var(--tinta-2); margin: 0 4px; min-height: 1.5em; } .kg-lectura b { color: var(--tinta); }
.kg-lista { margin-top: 10px; }
.kg-fila { display: flex; align-items: center; gap: 10px; padding: 5px 0 5px 4px; border-top: 1px solid var(--linea); }
.kg-fila span { flex: 1; color: var(--tinta-2); } .kg-fila b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.kg-fila button { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--tinta-3); flex: none; } .kg-fila button .ico { width: 16px; height: 16px; }
details.como { margin-top: 18px; border-top: 1px solid var(--linea); padding: 14px 4px 0; }
details.como summary { font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details.como summary::-webkit-details-marker { display: none; }
details.como summary .ico { transition: transform .2s; width: 18px; height: 18px; }
details.como[open] summary .ico { transform: rotate(90deg); }
details.como ul { margin: 10px 0 0; padding-left: 18px; color: var(--tinta-2); font-size: 13.5px; display: grid; gap: 7px; }
details.como a, .prosa a { color: var(--tinta); font-weight: 600; text-underline-offset: 3px; }

/* Barra inferior */
.pie { flex: none; padding: 0 14px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--hoja) 62%, transparent); margin-top: -34px; position: relative; z-index: 2; display: grid; gap: 10px; pointer-events: none; }
.pie > * { pointer-events: auto; }
.tabs { position: relative; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--hoja); border-radius: 24px; padding: 6px; box-shadow: 0 10px 30px rgb(var(--sombra) / .2), 0 0 0 1px var(--linea); }
.tabs::before { content: ''; position: absolute; top: 6px; bottom: 6px; left: 6px; width: calc((100% - 12px) / 4); border-radius: 18px; background: var(--accion); transition: transform .32s cubic-bezier(.2, .9, .25, 1.05); }
.tabs[data-pos="1"]::before { transform: translateX(100%); } .tabs[data-pos="2"]::before { transform: translateX(200%); } .tabs[data-pos="3"]::before { transform: translateX(300%); }
.tabs button { position: relative; height: 52px; display: grid; place-items: center; align-content: center; gap: 2px; font-size: 11.5px; font-weight: 700; color: var(--tinta-2); border-radius: 18px; transition: color .2s; }
.tabs button[aria-selected="true"] { color: var(--accion-tinta); }
.tabs .ico { width: 21px; height: 21px; }

/* Hojas emergentes */
.velo { position: absolute; inset: 0; z-index: 10; background: rgb(8 10 14 / .5); opacity: 0; pointer-events: none; transition: opacity .25s; }
.velo.abierto { opacity: 1; pointer-events: auto; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 92%; display: flex; flex-direction: column; background: var(--hoja); border-radius: 28px 28px 0 0; box-shadow: 0 -20px 60px rgb(0 0 0 / .3); transform: translateY(105%); transition: transform .34s cubic-bezier(.2, .9, .25, 1); }
.sheet.abierto { transform: none; }
.sheet.alta { height: 92%; }
.sheet-cab { flex: none; padding: 10px 16px 6px; }
.sheet-cab::before { content: ''; display: block; width: 40px; height: 5px; border-radius: 99px; background: var(--linea); margin: 0 auto 12px; }
.sheet-tit { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-tit h2 { font: 700 22px/1.15 var(--titulo); letter-spacing: -.01em; }
.sheet-cuerpo { overflow-y: auto; padding: 8px 16px calc(22px + env(safe-area-inset-bottom, 0px)); overscroll-behavior: contain; }
.cerrar { width: 36px; height: 36px; border-radius: 50%; background: var(--hundido); display: grid; place-items: center; flex: none; }
.cerrar .ico { width: 18px; height: 18px; }
.prosa { color: var(--tinta-2); font-size: 14px; display: grid; gap: 10px; }
.prosa b { color: var(--tinta); }
.ficha-cab { display: flex; gap: 16px; align-items: center; }
.ficha-cab h2 { font: 700 23px/1.1 var(--titulo); }
.tabla { width: 100%; border-collapse: collapse; margin-top: 14px; font-variant-numeric: tabular-nums; }
.tabla th { text-align: left; font-weight: 600; padding: 9px 0; }
.tabla td { text-align: right; font-weight: 700; padding: 9px 0; }
.tabla tr + tr th, .tabla tr + tr td { border-top: 1px solid var(--linea); }
.tabla .sub th { font-weight: 400; color: var(--tinta-2); padding-left: 18px; } .tabla .sub td { font-weight: 500; color: var(--tinta-2); }
.tabla .cab th, .tabla .cab td { font-size: 12.5px; color: var(--tinta-3); font-weight: 600; padding-top: 0; }
.fuente { font-size: 12.5px; color: var(--tinta-3); margin-top: 12px; line-height: 1.45; }
.aspectos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.aspecto { text-align: center; border-radius: 18px; padding: 8px 8px 11px; background: var(--hundido); display: grid; gap: 9px; font-weight: 700; font-size: 14.5px; box-shadow: 0 3px 0 var(--linea); }
.aspecto[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--tinta); }
.aspecto i { display: block; height: 62px; border-radius: 12px; position: relative; overflow: hidden; }
.aspecto i::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 42%; border-radius: 10px 10px 0 0; }
.aspecto i::after { left: 12px; right: 12px; }
.asp-auto i { background: linear-gradient(90deg, #E8ECF1 50%, #0D0F13 50%); } .asp-auto i::after { background: linear-gradient(90deg, #FFFFFF 50%, #20242C 50%); }
.asp-claro i { background: #E8ECF1; } .asp-claro i::after { background: #FFFFFF; }
.asp-oscuro i { background: #0D0F13; } .asp-oscuro i::after { background: #20242C; }
.aspecto span { display: block; }
.aspectos + .nota { margin-top: 16px; }
/* Hoy: las comidas apuntadas */
.comidas { display: grid; margin-top: 6px; }
.comida { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 4px; border-bottom: 1px solid var(--linea); text-align: left; width: 100%; }
.comida:last-child { border-bottom: 0; }
.comida-txt b { display: block; font-size: 15.5px; line-height: 1.25; }
.comida-txt small { display: block; margin-top: 3px; font-size: 12.5px; color: var(--tinta-2); font-variant-numeric: tabular-nums; }
.comida-hora { font-size: 13px; font-weight: 600; color: var(--tinta-3); font-variant-numeric: tabular-nums; }
.de-comida { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--linea); }
.de-comida:last-child { border-bottom: 0; }
.de-comida span i { font-style: normal; color: var(--tinta-2); }
.de-comida b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.guardados { display: grid; margin-top: 6px; }
.guardado { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--linea); }
.guardado:last-child { border-bottom: 0; }
.guardado button.txt { text-align: left; }
.guardado b { display: block; } .guardado small { color: var(--tinta-2); font-variant-numeric: tabular-nums; }

/* Aviso breve */
.toast { position: absolute; left: 50%; bottom: 150px; z-index: 20; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--tinta); color: var(--hoja); border-radius: 16px; padding: 11px 12px 11px 16px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 12px; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 12px 30px rgb(0 0 0 / .3); transition: opacity .2s, transform .25s cubic-bezier(.2, .9, .25, 1.2); }
.toast.visto { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { color: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 2px 4px; white-space: nowrap; }
.toast span { padding: 0 4px 0 0; }

@media (max-width: 359px) {
  .resumen { grid-template-columns: 126px minmax(0, 1fr); gap: 14px; } .plato { width: 126px; height: 126px; } .plato-centro b { font-size: 32px; } .plato-centro b.mil { font-size: 27px; }
  .metas { grid-template-columns: 1fr; } .fila { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 9px; } .mini { width: 40px; height: 40px; } .mini > span { width: 30px; height: 30px; font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

</style>
</head>
<body>
<div class="app" id="app">
  <main class="pantallas">

    <section class="pantalla activa" id="p-plato" aria-label="Mi plato">
      <header class="cima">
        <div class="cima-fila">
          <h1>Mi plato</h1>
          <div class="cima-botones">
            <button class="redondo" data-a="platos" aria-label="Platos guardados"><svg class="ico" viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 011 1v15l-6-4-6 4V5a1 1 0 011-1z"/></svg></button>
            <button class="redondo" data-a="aspecto" aria-label="Aspecto de la app"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 010 18z" fill="currentColor" stroke="none"/></svg></button>
          </div>
        </div>
        <div class="resumen">
          <div class="plato">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <defs>
                <radialGradient id="pl-base" cx="34%" cy="24%" r="90%"><stop offset="0" style="stop-color:var(--plato-luz)"/><stop offset="1" style="stop-color:var(--plato)"/></radialGradient>
                <linearGradient id="pl-hondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hondo-a)"/><stop offset="1" style="stop-color:var(--hondo-b)"/></linearGradient>
              </defs>
              <circle cx="80" cy="80" r="79" fill="url(#pl-base)"/>
              <circle cx="80" cy="80" r="78.5" fill="none" style="stroke:var(--plato-filo)" stroke-width="1"/>
              <circle cx="80" cy="80" r="65" fill="none" style="stroke:var(--pista)" stroke-width="12"/>
              <circle class="arco p" cx="80" cy="80" r="65" stroke-dasharray="0 500"/>
              <circle class="arco h" cx="80" cy="80" r="65" stroke-dasharray="0 500"/>
              <circle class="arco g" cx="80" cy="80" r="65" stroke-dasharray="0 500"/>
              <circle cx="80" cy="80" r="51" fill="url(#pl-hondo)"/>
              <circle cx="80" cy="80" r="50.5" fill="none" style="stroke:var(--plato-filo)" stroke-width="1"/>
            </svg>
            <div class="plato-centro"><b id="t-kcal">0</b><span>kcal</span></div>
          </div>
          <div class="datos" id="datos-plato">
            <div class="dato" data-m="p"><div class="dato-fila"><span class="dato-nombre"><i class="punto"></i>Proteína</span><span class="dato-valor"><b id="t-p">0</b><small id="s-p">g</small></span></div><div class="barra"><i id="b-p"></i></div></div>
            <div class="dato" data-m="h"><div class="dato-fila"><span class="dato-nombre"><i class="punto"></i>Hidratos</span><span class="dato-valor"><b id="t-h">0</b><small id="s-h">g</small></span></div><div class="barra"><i id="b-h"></i></div></div>
            <div class="dato" data-m="g"><div class="dato-fila"><span class="dato-nombre"><i class="punto"></i>Grasa</span><span class="dato-valor"><b id="t-g">0</b><small id="s-g">g</small></span></div><div class="barra"><i id="b-g"></i></div></div>
          </div>
        </div>
        <p class="dia" id="t-dia" hidden></p>
      </header>
      <div class="hoja">
        <div class="modos" id="modos-plato" role="tablist" aria-label="Qué sabes de tu plato">
          <button role="tab" data-a="modo" data-v="macros">Pongo los macros</button>
          <button role="tab" data-a="modo" data-v="gramos">Pongo los gramos</button>
        </div>
        <div id="plato-extra"></div>
        <div class="filas" id="plato-filas"></div>
        <p class="nota" id="plato-nota"></p>
      </div>
    </section>

    <section class="pantalla" id="p-alimentos" aria-label="Alimentos">
      <header class="cima">
        <div class="cima-fila">
          <h1>Alimentos</h1>
          <div class="cima-botones">
            <button class="redondo" data-a="nuevo" aria-label="Crear un alimento propio"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          </div>
        </div>
        <div id="busca-biblio"></div>
      </header>
      <div class="hoja">
        <div id="lista-biblio"></div>
        <p class="nota">Valores por 100 g. <button class="enlace" data-a="datos">De dónde salen los datos</button></p>
      </div>
    </section>

    <section class="pantalla" id="p-hoy" aria-label="Hoy">
      <header class="cima">
        <div class="cima-fila"><h1 id="hoy-titulo">Hoy</h1><button class="cima-fecha" id="hoy-fecha" data-a="mes" aria-label="Ver el mes"></button></div>
        <div class="semana" id="hoy-semana"></div>
        <p class="dia" id="hoy-sem-txt" hidden></p>
        <div class="resumen">
          <div class="plato">
            <svg viewBox="0 0 160 160" aria-hidden="true">
              <defs>
                <radialGradient id="hy-base" cx="34%" cy="24%" r="90%"><stop offset="0" style="stop-color:var(--plato-luz)"/><stop offset="1" style="stop-color:var(--plato)"/></radialGradient>
                <linearGradient id="hy-hondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--hondo-a)"/><stop offset="1" style="stop-color:var(--hondo-b)"/></linearGradient>
              </defs>
              <circle cx="80" cy="80" r="79" fill="url(#hy-base)"/>
              <circle cx="80" cy="80" r="78.5" fill="none" style="stroke:var(--plato-filo)" stroke-width="1"/>
              <circle cx="80" cy="80" r="65" fill="none" style="stroke:var(--pista)" stroke-width="12"/>
              <circle class="arco p" cx="80" cy="80" r="65" stroke-dasharray="0 500"/>
              <circle class="arco h" cx="80" cy="80" r="65" stroke-dasharray="0 500"/>

    platoTocado = false;
  }
  /** Pone el plato al día antes de pintarlo: uno vacío se prepara para la comida que toca; uno en marcha solo pone su cuota al día. */
  function alDia() {
    const P = S.plato;
    if (!P.items.length && !P.cambia && !platoTocado) { nuevoPlato(); guardar(); return; }
    if (P.auto) { const c = cuotaAhora(P.tam); if (c && c.nombre === P.comida) P.objetivo = c.objetivo; else if (!metaDia()) P.auto = false; }
    if (P.modo === 'macros' && !P.objetivo) P.objetivo = objetivoInicial();
  }
  const VERBO = { 'Desayuno': 'desayunar', 'Comida': 'comer', 'Merienda': 'merendar', 'Cena': 'cenar' };
  const ARTICULO = { 'Desayuno': 'el desayuno', 'Media mañana': 'la media mañana', 'Comida': 'la comida', 'Merienda': 'la merienda', 'Cena': 'la cena', 'Recena': 'la recena' };

  /* El veredicto de «pongo los macros»: qué pides, qué sale del plato y, si no cuadra, por qué y qué hacer. */
  function htmlVeredicto() { return veredictoHtml().replace(/(\d) g\b/g, '$1\u00a0g'); }   // «1.250 g» no se parte entre dos renglones
  function veredictoHtml() {
    const P = S.plato, xs = filas();
    const v = C.veredicto(P.objetivo, xs.map((x, i) => ({ a: x.a, gramos: x.it.gramos, fijo: x.it.modo === 'fijo', quieto: SOL.fij[i] != null && x.it.modo !== 'fijo' })), SOL);
    if (v.estado === 'vacio') return `<div class="veredicto"><h3>Elige qué vas a ${(P.auto && VERBO[P.comida]) || 'comer'}</h3> <p>Añade los alimentos y te digo cuántos gramos de cada uno te tocan.</p>${metaDia() ? '' : `<div class="chips"><button class="chip" data-a="ver-ejemplo">Ver un plato de ejemplo</button></div>`}</div>`;
    const de = (j) => esc(xs[j].a.n.toLowerCase());
    if (v.estado === 'clavado') {
      const muchos = v.enormes.map((j) => `${F(xs[j].it.gramos)} g de ${de(j)}`).join(' y ');
      return `<div class="veredicto bien">${ICO.check}<p><b>Clavado.</b> Con estos gramos, el plato da lo que pides.${muchos ? ` Eso sí: salen ${muchos}.` : ''}</p></div>`;
    }
    const sug = C.sugerir(SOL.desvio, TODOS, P.items.map((it) => it.id));
    const sugeridos = sug.length ? `<p class="v-que">Prueba a añadir algo con ${DE[sug[0].macro]}:</p><div class="chips en-fila">${sug.map((x) => `<button class="chip" data-a="sugerido" data-id="${x.id}">${ICO.mas}${esc(porId.get(x.id).n)}</button>`).join('')}</div>` : '';
    /* Lo que falta porque con más de ese alimento te pasarías de otro macro: se dice, y se ofrece subir ese otro. */
    const topes = {};
    v.lineas.forEach((l) => { const c = l.causa; if (c && c.tipo === 'limita') topes[c.m2] = Math.max(topes[c.m2] || 0, Math.ceil(c.hasta)); });
    const subir = Object.keys(topes).length ? `<div class="chips">${Object.keys(topes).map((m) => `<button class="chip" data-a="aceptar" data-m="${m}" data-v="${topes[m]}">${sug.length ? 'O subir' : 'Subir'} ${EL[m]} a ${F(topes[m])} g</button>`).join('')}</div>` : '';
    const limita = (l) => ` Con más ${de(l.causa.j)} te pasarías de ${DE[l.causa.m2]}.`;
    if (v.estado === 'falta') {
      const partes = v.lineas.map((l) => `<b>${F(Math.round(l.pide - l.sale))} g de ${DE[l.m]}</b>`);
      const frenos = [...new Set(v.lineas.filter((l) => l.causa && l.causa.tipo === 'limita').map(limita))].join('');
      return `<div class="veredicto"><h3>Añade algo más</h3> <p>Aún ${v.lineas.length === 1 && Math.round(v.lineas[0].pide - v.lineas[0].sale) === 1 ? 'falta' : 'faltan'} ${partes.length > 1 ? partes.slice(0, -1).join(', ') + ' y ' + partes[partes.length - 1] : partes[0]}.${frenos}</p>${sugeridos}${subir}</div>`;
    }
    const porque = (l) => {
      const c = l.causa; if (!c) return '';
      if (c.tipo === 'sin') return ` En el plato no hay nada con ${DE[l.m]}.`;
      if (c.tipo === 'limita') return limita(l);
      if (c.tipo === 'tope') return ` Y ya van ${F(c.gramos)} g de ${de(c.j)}.`;
      if (c.tipo === 'fijo' && v.todoFijo) return '';                    // se dice una vez, abajo
      if (c.tipo === 'fijo') return l.tipo === 'falta' ? ` Lo que lleva ${DE[l.m]} tiene el candado puesto.` : ` Con el candado en ${F(c.gramos)} g de ${de(c.j)} ya salen ${g1(c.aporta)} g.`;
      return c.solo ? ` Solo con ${de(c.j)} ya salen ${g1(c.aporta)} g.` : ` Lo que más trae es ${de(c.j)}: ${g1(c.aporta)} g.`;
    };
    const lineas = v.lineas.map((l) => `<li><i class="punto ${l.m}"></i><span><b>${NOMBRE[l.m]}:</b> pides ${F(l.pide)} g y salen ${g1(l.sale)} g.${porque(l)}</span></li>`).join('');
    const sobra = v.lineas.filter((l) => l.tipo === 'sobra');
    let salida = '';
    if (v.todoFijo) salida = `<p class="v-que">Todo tiene el candado puesto: suelta alguno para que pueda ajustar.</p>`;
    else if (sug.length || subir) salida = sugeridos + subir;
    else if (sobra.length) salida = `<div class="chips">${sobra.map((l) => `<button class="chip" data-a="aceptar" data-m="${l.m}" data-v="${Math.round(l.sale)}">Dejarlo en ${F(Math.round(l.sale))} g de ${DE[l.m]}</button>`).join('')}</div>`;
    return `<div class="veredicto${v.estado === 'casi' ? '' : ' ojo'}"><h3>${v.estado === 'casi' ? 'Casi clavado' : 'Con estos alimentos no sale'}</h3><ul class="v-lineas">${lineas}</ul>${salida}</div>`;
  }

  /** El rótulo de los tres campos: «Comida: te tocan» si lo pone el plan; «En este plato quiero» si los números son tuyos. */
  function htmlRotulo() {
    const P = S.plato, n = esc(P.comida || ''), t = P.tam;
    const txt = !(P.auto && P.comida) ? 'En este plato quiero'
      : t === 'todo' ? `<b>${n}:</b> todo lo que te queda` : `<b>${n}${t === 'suave' ? ' suave' : t === 'fuerte' ? ' fuerte' : ''}:</b> te tocan`;
    return `<h3>${txt}</h3> <span class="obj-kcal" id="obj-kcal"></span>`;
  }
  const TAMANOS = [['suave', 'Suave'], ['normal', 'Normal'], ['fuerte', 'Fuerte'], ['todo', 'Todo']];
  /** Debajo de los campos: el tamaño de esta comida (lo decide quien come) y «algo entre horas». Sin macros del día, lo primero es calcularlos. */
  function htmlAtajos() {
    const P = S.plato;
    if (!metaDia()) return `<div class="aviso-ej"><span>Dime tus macros del día y en cada comida te diré cuánto te toca</span> <button class="chip" data-a="ir-macros">Calcular mis macros</button></div>`;
    const elegido = P.auto && P.comida ? (P.tam || 'normal') : null;      // con números puestos a mano no hay tamaño marcado
    const tamanos = cuotaAhora() ? `<div class="tamanos" role="group" aria-label="Tamaño de esta comida">${TAMANOS.map(([v, t]) => `<button data-a="tam" data-v="${v}" aria-pressed="${elegido === v}">${t}</button>`).join('')}</div>` : '';
    return tamanos + `<div class="chips"><button class="chip" data-a="entre-horas">Algo entre horas</button></div>`;
  }
  function htmlExtra() {
    const P = S.plato;
    if (P.modo !== 'macros') {
      if (P.ejemplo) return `<div class="aviso-ej"><span>Plato de ejemplo, para que pruebes</span><button class="chip" data-a="vaciar">Empezar el mío</button></div>`;
      if (P.comida == null && !P.cambia && cuotaAhora()) return `<div class="aviso-ej"><span>Algo entre horas, sin objetivo</span> <button class="chip" data-a="obj-toca">Volver a lo que toca</button></div>`;
      if (!P.items.length && !P.cambia && metaDia() && comidasHoy().length && !cuotaAhora()) return `<div class="aviso-ej"><span>${C.comidaQueToca(S.meta.comidas, comidasHoy().map((c) => c.nombre), horaAhora()) ? 'Ya has llegado a tus macros de hoy' : 'Las comidas de hoy ya están apuntadas'}. Si comes algo más, apúntalo aquí.</span></div>`;
      return '';
    }
    const o = P.objetivo;
    const campo = (m) => `<label class="campo-m" data-m="${m}"><span>${NOMBRE[m]}</span><div><input inputmode="numeric" pattern="[0-9]*" maxlength="3" data-in="obj" data-m="${m}" value="${F(C.num(o[m]))}" aria-label="${NOMBRE[m]} que quieres en este plato, en gramos"><em>g</em></div></label>`;
    return `<div class="objetivo">
      <div class="rotulo" id="obj-rotulo">${htmlRotulo()}</div>
      <div class="obj-campos">${MAC.map(campo).join('')}</div>
      <div id="obj-chips">${htmlAtajos()}</div>
      <div id="veredicto">${htmlVeredicto()}</div>
      ${P.items.length ? `<h3 class="rotulo">Te tocan estos gramos</h3>` : ''}</div>`;
  }

  const pintaObjKcal = () => { const el = $('#obj-kcal'), o = S.plato.objetivo; if (el && o) el.textContent = `${F(4 * C.num(o.p) + 4 * C.num(o.h) + 9 * C.num(o.g))} kcal`; };

  /** Pinta la pantalla entera del plato. */
  function pintaPlato() {
    alDia();
    const P = S.plato;
    ponModos('#modos-plato', P.modo === 'macros' ? 0 : 1);
    SOL = resolver();
    $('#plato-extra').innerHTML = htmlExtra();
    const xs = filas();
    $('#plato-filas').innerHTML = xs.map(htmlFila).join('') || (P.modo === 'macros' ? '' : `<div class="vacio"><b>Tu plato está vacío</b>Añade lo que vas a comer y verás al momento sus calorías y sus macros.</div>`);
    $('#plato-nota').textContent = !xs.length ? '' : P.modo === 'macros'
      ? 'El candado deja fija una cantidad. Lo ligero (verdura, leche, café con leche…) viene fijado en su ración; suéltalo si quieres que también se ajuste.'
      : 'Toca un alimento para ver su detalle o quitarlo.';
    pintaObjKcal(); pintaResumen(); pintaPie();
  }

  /** Recalcula sin volver a pintar los campos (para no perder el foco al escribir). */
  function refrescaPlato() {
    const macros = S.plato.modo === 'macros';
    if (macros) SOL = resolver();
    filas().forEach((x, i) => {
      const fila = $(`#plato-filas .fila[data-i="${i}"]`); if (!fila) return;
      const m = C.macros(x.a, x.it.gramos), inp = $('input', fila);
      $('.fila-sub', fila).innerHTML = subPlato(m, macros && SOL.fij[i] == null && x.it.gramos === 0);
      if (inp !== document.activeElement && inp.value !== String(x.it.gramos)) {
        inp.value = x.it.gramos;
        const caja = $('.peso', fila); caja.classList.remove('cambia'); void caja.offsetWidth; caja.classList.add('cambia');
      }
      if (macros) {
        const fijo = SOL.fij[i] != null, cand = $('.candado', fila);
        cand.setAttribute('aria-pressed', String(fijo)); cand.innerHTML = fijo ? ICO.cerrado : ICO.abierto;
        $('.peso', fila).classList.toggle('calculado', !fijo);
      }
    });
    if (macros) { const v = $('#veredicto'); if (v) v.innerHTML = htmlVeredicto(); pintaObjKcal(); }
    pintaResumen();
  }

  function tocado() { if (S.plato.ejemplo) { S.plato.ejemplo = false; const av = $('.aviso-ej'); if (av) av.remove(); } guardar(); }
  const paso = (a) => (a.r <= 20 ? 1 : 5);
  function sumaGramos(i, signo) {
    const x = filas()[i]; if (!x) return;
    x.it.gramos = Math.max(0, Math.min(5000, Math.round((x.it.gramos + signo * paso(x.a)) / paso(x.a)) * paso(x.a)));
    $(`#plato-filas .fila[data-i="${i}"] input`).value = x.it.gramos;
    tocado(); refrescaPlato();
  }
  /** Añade un alimento con su ración habitual. Si el plato es el de ejemplo, lo sustituye (salvo `conserva`). */
  function anade(id, callado, conserva) {
    const a = porId.get(id); if (!a) return;
    if (S.plato.ejemplo && !conserva) S.plato.items = [];
    S.plato.ejemplo = false;
    S.plato.items.push({ id, gramos: a.r });
    guardar();
    if (!callado) toast(`${a.n}: ${a.r} g en el plato`);
  }
  function quita(i) {
    const previo = JSON.stringify(S.plato), x = filas()[i]; if (!x) return;
    S.plato.items.splice(i, 1); S.plato.ejemplo = false; guardar(); pintaPlato();
    toast(`${x.a.n}, fuera del plato`, 'Deshacer', () => { S.plato = JSON.parse(previo); platoTocado = true; guardar(); pintaPlato(); });
  }
  function objetivoInicial() {
    const md = metaDia();
    if (md) return C.porComida(md, S.meta.comidas);
    const t = C.totales(filas().map((x) => ({ a: x.a, gramos: x.it.gramos })));
    return t.kcal > 0 ? { p: Math.round(t.p), h: Math.round(t.h), g: Math.round(t.g) } : { p: 40, h: 60, g: 15 };
  }

  /* ── Biblioteca (pantalla Alimentos y hoja «Añadir») ─ */
  const FIL = { biblio: { q: '', cat: null, orden: 'az' }, elegir: { q: '', cat: null, orden: 'az' } };
  function htmlBuscador(k) {
    const f = FIL[k], chip = (v, t) => `<button class="chip" data-a="cat" data-k="${k}" data-v="${v}" aria-pressed="${String(f.cat) === String(v)}">${t}</button>`;
    let chips = '';
    if (S.favs.length) chips += chip('fav', 'Favoritos');
    if (S.propios.length) chips += chip(CAT_MIOS, 'Míos');
    CATS.slice(0, CAT_MIOS).forEach((c, i) => { chips += chip(i, c); });
    return `<div class="buscador">${ICO.lupa}<input type="search" data-in="q" data-k="${k}" value="${esc(f.q)}" placeholder="Busca entre ${TODOS.length} alimentos" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar alimento"></div>
      <div class="cinta" id="cinta-${k}">${chips}</div>`;
  }
  /* Formas de ordenar la lista. En cada fila se resalta el dato por el que está ordenada. */
  const ORDENES = [['az', 'Por nombre'], ['prot', 'Más proteína'], ['hid', 'Más hidratos'], ['gra', 'Más grasa'], ['fib', 'Más fibra'],
    ['kcal', 'Menos calorías'], ['mkcal', 'Más calorías'], ['pk', 'Más proteína por caloría']];
  const MACRO_ORDEN = { prot: 'p', hid: 'h', gra: 'g' };
  function subLista(a, orden) {
    let s = trio(a, true, MACRO_ORDEN[orden]);
    if (orden === 'fib') s += `<span class="m clave">Fibra ${g1(a.f)}</span>`;
    if (orden === 'pk') s += `<span class="m clave">${g1(C.proteinaPorCaloria(a))} g de proteína cada 100 kcal</span>`;
    return s;
  }
  function htmlLista(k) {
    const f = FIL[k];
    let base = TODOS, cat = f.cat;
    if (cat === 'fav') { base = TODOS.filter((a) => S.favs.indexOf(a.id) >= 0); cat = null; }
    const res = C.buscar(base, f.q, { cat: cat == null ? undefined : Number(cat), orden: f.orden });
    const cab = `<div class="orden"><span>${res.length === 1 ? '1 alimento' : F(res.length) + ' alimentos'}</span><select data-in="orden" data-k="${k}" aria-label="Ordenar la lista">${ORDENES.map((o) => `<option value="${o[0]}"${f.orden === o[0] ? ' selected' : ''}>${o[1]}</option>`).join('')}</select></div>`;
    if (!res.length) return cab + `<div class="vacio"><b>No lo encuentro</b>Prueba con otra palabra o créalo tú con los datos de su etiqueta.<div style="margin-top:14px"><button class="btn suave" data-a="nuevo" data-k="${k}">Crear este alimento</button></div></div>`;
    return cab + `<div class="filas">` + res.map((a) => {
      const dentro = enPlato(a.id) >= 0;
      return `<div class="fila">${mini(a)}
        <button class="fila-txt" data-a="ficha" data-id="${a.id}"><span class="fila-nombre">${nombre(a)}</span><span class="fila-sub">${subLista(a, f.orden)}</span></button>
        <div class="fila-fin"><div class="fila-kcal">${F(a.k)}<small>kcal</small></div><button class="anadir${dentro ? ' puesto' : ''}" data-a="alternar" data-id="${a.id}" aria-label="${dentro ? 'Quitar del plato' : 'Añadir al plato'}: ${esc(a.n)}" aria-pressed="${dentro}">${dentro ? ICO.check : ICO.mas}</button></div></div>`;
    }).join('') + `</div>`;
  }
  function pintaLista(k) { const el = $('#lista-' + k); if (el) el.innerHTML = htmlLista(k); }
  function pintaBiblio() { $('#busca-biblio').innerHTML = htmlBuscador('biblio'); pintaLista('biblio'); }

  /* ── Hojas emergentes ──────────────────────────── */
  const sheet = $('#sheet'), velo = $('#velo');
  let alCerrar = null, abierta = false;
  function abre(cab, cuerpo, opts) {
    opts = opts || {};
    sheet.className = 'sheet' + (opts.alta ? ' alta' : '');
    sheet.innerHTML = `<div class="sheet-cab"><div class="sheet-tit">${cab}<button class="cerrar" data-a="cerrar" aria-label="Cerrar">${ICO.x}</button></div>${opts.bajoCab || ''}</div><div class="sheet-cuerpo">${cuerpo}</div>`;
    alCerrar = opts.alCerrar || null; abierta = true;
    requestAnimationFrame(() => { sheet.classList.add('abierto'); velo.classList.add('abierto'); });
  }
  function cierra() {
    if (!abierta) return;
    abierta = false; sheet.classList.remove('abierto'); velo.classList.remove('abierto');
    if (document.activeElement && sheet.contains(document.activeElement)) document.activeElement.blur();
    const f = alCerrar; alCerrar = null; if (f) f();
  }
  const h2 = (t) => `<h2 id="sheet-h">${esc(t)}</h2>`;

  function abreElegir() {
    FIL.elegir.q = '';
    abre(h2('Añadir al plato'), `<div id="lista-elegir">${htmlLista('elegir')}</div>`, { alta: true, bajoCab: htmlBuscador('elegir'), alCerrar: pintaPlato });
    if (window.matchMedia && matchMedia('(pointer: fine)').matches) setTimeout(() => { const q = $('#sheet input[type="search"]'); if (q) q.focus(); }, 360);
  }

  function abreFicha(id, i) {
    const a = porId.get(id); if (!a) return;
    const idx = i != null && S.plato.items[i] && S.plato.items[i].id === id ? i : enPlato(id);
    const g = idx >= 0 ? S.plato.items[idx].gramos : a.r, m = C.macros(a, g);
    const v = (x, dec) => (x == null ? '–' : F(x, dec == null ? 1 : dec));
    const fila = (t, c100, cg, sub) => `<tr${sub ? ' class="sub"' : ''}><th>${t}</th><td>${c100}</td><td>${cg}</td></tr>`;
    const q = g / 100;
    const fuente = a.src === 'U' ? `Fuente: USDA FoodData Central (SR Legacy), n.º ${a.sid}. Nombre original: «${esc(a.o)}».`
      : a.src === 'C' ? `Fuente: tabla CIQUAL 2017 (Anses, Francia), código ${a.sid}. Nombre original: «${esc(a.o)}».` : 'Alimento creado por ti con los datos de su etiqueta.';
    const fav = S.favs.indexOf(id) >= 0;
    const cuerpo = `<table class="tabla">
        <tr class="cab"><th></th><td>100 g</td><td>${F(g)} g</td></tr>
        ${fila('Calorías', F(a.k) + ' kcal', F(m.kcal) + ' kcal')}
        ${fila('<span class="m"><i class="punto p"></i>Proteína</span>', v(a.p) + ' g', v(m.p) + ' g')}
        ${fila('<span class="m"><i class="punto h"></i>Hidratos</span>', v(a.h) + ' g', v(m.h) + ' g')}
        ${a.az == null ? '' : fila('de los que azúcares', v(a.az) + ' g', v(a.az * q) + ' g', true)}
        ${fila('<span class="m"><i class="punto g"></i>Grasa</span>', v(a.g) + ' g', v(m.g) + ' g')}
        ${a.sa == null ? '' : fila('de la que saturada', v(a.sa) + ' g', v(a.sa * q) + ' g', true)}
        ${fila('Fibra', v(a.f) + ' g', v(m.f) + ' g')}
      </table>
      <p class="fuente">${fuente}</p>
      <div style="display:grid;gap:10px;margin-top:16px">
        ${idx >= 0 ? `<button class="btn suave peligro" data-a="quitar" data-i="${idx}">Quitar del plato</button>` : `<button class="btn" data-a="anadir-ficha" data-id="${id}">${ICO.mas}Añadir al plato</button>`}
        ${a.src === 'P' ? `<button class="btn suave peligro" data-a="borrar-propio" data-id="${id}">Borrar este alimento</button>` : ''}
      </div>`;
    abre(`<div class="ficha-cab">${mini(a, true)}<div><h2 id="sheet-h">${esc(a.n)}</h2><div style="margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${estado(a)}<button class="chip" data-a="fav" data-id="${id}" aria-pressed="${fav}">${ICO.estrella}Favorito</button></div></div></div>`, cuerpo);
  }

  function abreAspecto() {
    const op = (v, t) => `<button class="aspecto asp-${v}" data-a="pon-aspecto" data-v="${v}" aria-pressed="${S.aspecto === v}"><i></i><span>${t}</span></button>`;
    abre(h2('Aspecto'), `<div class="aspectos">${op('auto', 'Automático')}${op('claro', 'Claro')}${op('oscuro', 'Oscuro')}</div><p class="nota">Automático sigue el modo de tu móvil.</p>`);
  }

  function resumenPlato(items) {
    const t = C.totales(items.map((it) => ({ a: porId.get(it.id), gramos: it.gramos })).filter((x) => x.a));
    return `${F(t.kcal)} kcal · P ${g1(t.p)} · H ${g1(t.h)} · G ${g1(t.g)}`;
  }
  function abrePlatos() {
    const hay = S.plato.items.length > 0;

  function pintaMes(a, m) { const x = htmlMes(a, m); $('#sheet-h').textContent = x.titulo; $('#mes-cuerpo').innerHTML = x.cuerpo; }

      el.innerHTML = `<p class="nota" style="margin:16px 4px 10px">Pon los gramos al día que te haya dado tu entrenador o tu nutricionista.</p>
        <div class="obj-campos">${MAC.map(campo).join('')}</div><p class="subtitulo" id="mano-kcal"></p><div id="comidas">${htmlComidas()}</div><div id="fila-peso">${htmlFilaPeso()}</div>`;

        <div class="modos" id="modos-sexo" role="tablist" aria-label="Sexo"><button role="tab" data-a="sexo" data-v="h">Hombre</button><button role="tab" data-a="sexo" data-v="m">Mujer</button></div>
        <div class="form-3">${campo('edad', 'Edad', 'años', 'numeric')}${campo('peso', 'Peso', 'kg', 'decimal')}${campo('altura', 'Altura', 'cm', 'numeric')}</div>
        <div class="actividad"><b id="act-n">${n.n}</b><small id="act-d">${n.d}</small><input type="range" min="1" max="5" step="1" value="${p.nivel}" data-in="nivel" aria-label="Nivel de actividad"></div>
      </div>
      ${p.ejemplo ? `<p class="nota" id="nota-ej">Son datos de ejemplo: cámbialos por los tuyos.</p>` : ''}

  }
  function pintaManoKcal() { const md = metaDia(), el = $('#mano-kcal'); if (el) el.textContent = md ? `En total, ${F(md.kcal)} kcal al día` : 'Rellena los tres para empezar'; }
  function refrescaMetas() { const m = $('#metas'); if (m) m.innerHTML = htmlMetas(); const c = $('#comidas'); if (c) c.innerHTML = htmlComidas(); }

  /* ── El peso ───────────────────────────────────── */
  const MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  /** «hoy», «ayer» o «17 nov» (con el año si no es este). */
  function diaCorto(k) {
    const hoy = claveHoy();
    if (k === hoy) return 'hoy';
    if (k === C.otroDia(hoy, -1)) return 'ayer';
    const f = C.fechaDe(k);
    return `${f.getDate()} ${MES3[f.getMonth()]}` + (k.slice(0, 4) !== hoy.slice(0, 4) ? ' ' + k.slice(0, 4) : '');
  }
  const elDia = (k) => { const d = diaCorto(k); return /^\d/.test(d) ? 'el ' + d : d; };       // «el 17 nov», «ayer», «hoy»
  const kilos = (v) => F(v, 1) + ' kg';
  const PESOS_VISTOS = 30;                               // la gráfica y el resumen miran los últimos pesos apuntados
  const fraseCambio = (c) => (c.kg === 0 ? `Igual que hace ${C.plazo(c.dias)}` : `${kilos(Math.abs(c.kg))} ${c.kg < 0 ? 'menos' : 'más'} en ${C.plazo(c.dias)}`);
  /** La fila de «Mis macros»: el último peso y cómo va; al tocarla se abre la hoja. */
  function htmlFilaPeso() {
    const ps = S.pesos, u = ps[ps.length - 1], c = C.cambioPeso(ps.slice(-PESOS_VISTOS));
    const sub = !u ? 'Apúntalo de vez en cuando y verás cómo va.' : c ? fraseCambio(c) : `Apuntado ${elDia(u.f)}`;
    return `<button class="linea-dato toca" data-a="peso"><span><b>${u ? `Mi peso: ${kilos(u.kg)}` : 'Mi peso'}</b> <small>${sub}</small></span><span class="pildora">${u && u.f === claveHoy() ? 'Ver' : 'Apuntar'}</span></button>`;
  }
  let trazo = [];                                        // los puntos de la gráfica abierta, para leerlos al tocarla
  const G_ANCHO = 340, G_ALTO = 104, G_AIRE = 24;        // la caja de la línea y el aire de arriba para los rótulos
  function htmlPeso() {
    const hoy = claveHoy(), ps = S.pesos, u = ps[ps.length - 1], vistos = ps.slice(-PESOS_VISTOS), c = C.cambioPeso(vistos);
    const propone = u ? u.kg : (S.perfil.ejemplo ? 0 : S.perfil.peso);
    let h = `<div class="kg-pon"><label class="kg-campo"><input id="kg-in" inputmode="decimal" maxlength="5" value="${propone ? F(propone, 1) : ''}" placeholder="0,0" aria-label="Tu peso de hoy, en kilos"><em>kg</em></label>
      <button class="btn" data-a="peso-apuntar">${u && u.f === hoy ? 'Cambiar el peso de hoy' : 'Apuntar el peso de hoy'}</button></div>`;
    trazo = [];
    if (c) {
      trazo = C.trazoPeso(vistos, G_ANCHO, G_ALTO, 14, 2);              // la caja abarca 2 kg como poco
      const a = trazo[0], z = trazo[trazo.length - 1], muchos = trazo.length > 12;
      h += `<p class="kg-resumen" id="kg-resumen">${fraseCambio(c)}</p>
        <svg id="kg-grafica" viewBox="0 0 ${G_ANCHO} ${G_ALTO + G_AIRE}" role="img" aria-label="Tu peso: de ${kilos(a.kg)} ${elDia(a.f)} a ${kilos(z.kg)} ${elDia(z.f)}">
          <g transform="translate(0 ${G_AIRE})">
            <line class="kg-guia" id="kg-guia" x1="0" x2="0" y1="${-G_AIRE + 4}" y2="${G_ALTO}" hidden></line>
            <polyline class="kg-linea" points="${trazo.map((p) => p.x + ',' + p.y).join(' ')}"></polyline>
            ${trazo.map((p, i) => `<circle class="kg-pt${muchos && i < trazo.length - 1 ? ' chico' : ''}" cx="${p.x}" cy="${p.y}" r="${i === trazo.length - 1 ? 5 : muchos ? 2.5 : 4}"></circle>`).join('')}
            <circle class="kg-sel" id="kg-sel" r="6.5" hidden></circle>
            <text class="kg-rot" x="${a.x - 6}" y="${a.y - 11}">${F(a.kg, 1)}</text><text class="kg-rot fin" x="${z.x + 6}" y="${z.y - 12}" text-anchor="end">${F(z.kg, 1)}</text>
          </g></svg>
        <p class="kg-lectura" id="kg-lectura">${`De ${elDia(a.f)} a ${elDia(z.f)}`.replace('De el', 'Del').replace('a el', 'al')}</p>`;
    }
    if (ps.length) h += `<div class="kg-lista">` + ps.slice().reverse().map((x) =>
      `<div class="kg-fila"><span>${capital(diaCorto(x.f))}</span> <b>${kilos(x.kg)}</b> <button data-a="peso-quitar" data-f="${x.f}" aria-label="Borrar el peso de ${elDia(x.f)}">${ICO.x}</button></div>`).join('') + `</div>`;
    return h;
  }
  function abrePeso() { abre(h2('Mi peso'), `<div id="kg-cuerpo">${htmlPeso()}</div>`); }
  /** Tras apuntar o borrar un peso: la hoja (si sigue abierta) y la pantalla de detrás, que también lo enseña. */
  function pintaPeso() { const el = $('#kg-cuerpo'); if (el) el.innerHTML = htmlPeso(); if (pestana === 'macros') pintaMacros(); }
  /** Al tocar o pasar por la gráfica: marca el peso más cercano y lo dice debajo. */
  function leePeso(e) {
    const g = e.target.closest && e.target.closest('#kg-grafica'); if (!g || !trazo.length) return;
    const r = g.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * G_ANCHO;
    const p = trazo.reduce((m, q) => (Math.abs(q.x - x) < Math.abs(m.x - x) ? q : m), trazo[0]);
    const guia = $('#kg-guia'), sel = $('#kg-sel');
    guia.setAttribute('x1', p.x); guia.setAttribute('x2', p.x); guia.removeAttribute('hidden');
    sel.setAttribute('cx', p.x); sel.setAttribute('cy', p.y); sel.removeAttribute('hidden');
    $('#kg-lectura').innerHTML = `<b>${capital(diaCorto(p.f))}:</b> ${kilos(p.kg)}`;
  }
  document.addEventListener('pointerdown', leePeso);
  document.addEventListener('pointermove', leePeso);

  /* ── Navegación y aspecto ──────────────────────── */
  const TABS = ['plato', 'alimentos', 'hoy', 'macros'];
  let pestana = 'plato';
  function irA(t) {
    pestana = t;
    $$('.pantalla').forEach((p) => p.classList.toggle('activa', p.id === 'p-' + t));
    const nav = $('#tabs'); nav.dataset.pos = TABS.indexOf(t);
    $$('button', nav).forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === t)));
    if (t === 'plato') pintaPlato(); else if (t === 'alimentos') pintaLista('biblio'); else if (t === 'hoy') pintaHoy(); else pintaMacros();
    pintaPie();
  }
  function aplicaAspecto() {
    const r = document.documentElement;
    let a = S.aspecto;
    if (a === 'auto') { const t = r.getAttribute('data-theme'); a = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'oscuro' : 'claro'; }
    r.setAttribute('data-aspecto', a);

  }

    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicaAspecto);
  } catch (e) { /* navegadores antiguos */ }

      guardar(); pintaPeso();
      toast('Peso borrado', 'Deshacer', () => { const x = JSON.parse(previo); S.pesos = x.pesos; S.perfil.peso = x.peso; guardar(); pintaPeso(); });
    },
    'mes-ir': (el) => { const v = el.dataset.v.split('-').map(Number); pintaMes(v[0], v[1]); },
    cerrar: cierra,
    toast: () => { const f = accionToast; accionToast = null; $('#toast').classList.remove('visto'); if (f) f(); },
    modo: (el) => {
      const P = S.plato; if (P.modo === el.dataset.v) return;

      if (P.modo === 'macros') {
        const c = cuotaAhora();                                          // con plan, «macros» es la comida que toca
        if (c && !P.cambia && (!P.objetivo || P.comida == null)) { P.comida = c.nombre; P.objetivo = c.objetivo; P.auto = true; P.tam = 'normal'; }

    menos: (el) => { if (conPuntero) { conPuntero = false; return; } sumaGramos(+el.dataset.i, -1); },

    anadir: abreElegir,

      const dentro = enPlato(id) >= 0;
      el.classList.toggle('puesto', dentro); el.innerHTML = dentro ? ICO.check : ICO.mas; el.setAttribute('aria-pressed', String(dentro));

    'anadir-ficha': (el) => { anade(el.dataset.id); cierra(); if (pestana === 'plato') pintaPlato(); else pintaLista('biblio'); },
    sugerido: (el) => { anade(el.dataset.id, true, true); pintaPlato(); },
    quitar: (el) => { cierra(); quita(+el.dataset.i); if (pestana !== 'plato') pintaLista('biblio'); },
    ficha: (el) => {

    },
    fav: (el) => {
      const id = el.dataset.id, i = S.favs.indexOf(id);

      el.setAttribute('aria-pressed', String(i < 0));

    },
    cat: (el) => {

    },
    vaciar: () => {
      const previo = JSON.stringify(S.plato);
      nuevoPlato(); guardar(); cierra(); pintaPlato();

    },
    /* El tamaño de esta comida: vuelve a lo que toca según el plan, en la medida elegida. */
    tam: (el) => { const P = S.plato, c = cuotaAhora(el.dataset.v); if (!c) return; P.modo = 'macros'; P.comida = c.nombre; P.tam = el.dataset.v; P.objetivo = c.objetivo; P.auto = true; platoTocado = true; guardar(); pintaPlato(); },

    'ver-ejemplo': () => { S.plato = { items: EJEMPLO.map((x) => ({ id: x.id, gramos: x.gramos })), modo: 'gramos', objetivo: null, ejemplo: true, comida: null }; platoTocado = true; guardar(); pintaPlato(); },
    'ir-macros': () => irA('macros'),

    cuadrar: () => { if (claveVista() !== claveHoy()) { diaVisto = null; pintaHoy(); $('#p-hoy').scrollTop = 0; } else irA('plato'); },   // «Volver a hoy» o «Preparar la cena»
    apuntar: abreApuntar,

      const previo = JSON.stringify({ plato: S.plato, dias: S.dias }), cam = S.plato.cambia, k = cam ? cam.dia : claveHoy();   // una comida que se estaba cambiando vuelve a su día

    'meta-modo': (el) => { S.meta.modo = el.dataset.v; guardar(); pintaMacros(); },
    sexo: (el) => { S.perfil.sexo = el.dataset.v; S.perfil.ejemplo = false; guardar(); ponModos('#modos-sexo', el.dataset.v === 'm' ? 1 : 0); refrescaMetas(); const n = $('#nota-ej'); if (n) n.remove(); },
    meta: (el) => { S.meta.tipo = S.meta.tipo === el.dataset.v ? null : el.dataset.v; guardar(); refrescaMetas(); if (S.meta.tipo) toast(`Tu objetivo: ${METAS[S.meta.tipo].toLowerCase()}`); },
    comidas: (el) => { S.meta.comidas = Math.max(2, Math.min(6, S.meta.comidas + (+el.dataset.v))); guardar(); $('#comidas').innerHTML = htmlComidas(); }
  };
  document.addEventListener('click', (e) => { const el = e.target.closest('[data-a]'); if (el && ACC[el.dataset.a]) ACC[el.dataset.a](el, e); });

  /* Mantener pulsado − o + va sumando solo */
  let tRep = 0, iRep = 0;
  const paraRep = () => { clearTimeout(tRep); clearInterval(iRep); };
  document.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('[data-a="mas"],[data-a="menos"]'); if (!el) return;
    const i = +el.dataset.i, s = el.dataset.a === 'mas' ? 1 : -1;
    conPuntero = true; sumaGramos(i, s); paraRep();
    tRep = setTimeout(() => { iRep = setInterval(() => sumaGramos(i, s), 70); }, 420);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => document.addEventListener(ev, paraRep, true));

  /* ── Escritura en campos ───────────────────────── */
  const ENT = {
    gramos: (el) => {
      const i = +el.dataset.i, it = S.plato.items[i]; if (!it) return;
      el.value = el.value.replace(/\D/g, '');
      it.gramos = Math.min(5000, C.num(el.value));
      if (S.plato.modo === 'macros') it.modo = 'fijo';
      tocado(); refrescaPlato();
    },
    obj: (el) => {
      const P = S.plato; el.value = el.value.replace(/\D/g, '');
      P.objetivo = Object.assign({}, P.objetivo, { [el.dataset.m]: C.num(el.value) }); platoTocado = true;
      if (P.auto) { P.auto = false; $('#obj-rotulo').innerHTML = htmlRotulo(); $('#obj-chips').innerHTML = htmlAtajos(); }
      guardar(); refrescaPlato();
    },
    q: (el) => { FIL[el.dataset.k].q = el.value; pintaLista(el.dataset.k); },
    otra: (el) => { if (el.value.trim()) $$('#sheet [data-a="que-comida"]').forEach((b) => b.setAttribute('aria-pressed', 'false')); },
    orden: (el) => { FIL[el.dataset.k].orden = el.value; pintaLista(el.dataset.k); },
    perfil: (el) => {
      S.perfil[el.dataset.k] = C.num(el.value); S.perfil.ejemplo = false;
      if (el.dataset.k === 'peso') { S.pesos = C.ponPeso(S.pesos, claveHoy(), S.perfil.peso); $('#fila-peso').innerHTML = htmlFilaPeso(); }   // el peso es uno: también queda apuntado hoy
      guardar(); refrescaMetas(); const n = $('#nota-ej'); if (n) n.remove();
    },
    nivel: (el) => { S.perfil.nivel = +el.value; S.perfil.ejemplo = false; const n = NIVELES[S.perfil.nivel - 1]; $('#act-n').textContent = n.n; $('#act-d').textContent = n.d; guardar(); refrescaMetas(); const x = $('#nota-ej'); if (x) x.remove(); },
    mano: (el) => { el.value = el.value.replace(/\D/g, ''); S.meta.mano[el.dataset.m] = el.value === '' ? null : C.num(el.value); guardar(); pintaManoKcal(); $('#comidas').innerHTML = htmlComidas(); }
  };
  const alEscribir = (e) => { const k = e.target.dataset && e.target.dataset.in; if (k && ENT[k]) ENT[k](e.target); };
  document.addEventListener('input', alEscribir);
  document.addEventListener('change', (e) => { if (e.target.tagName === 'SELECT') alEscribir(e); });
  document.addEventListener('focusin', (e) => { if (e.target.tagName === 'INPUT' && e.target.dataset.in && e.target.type !== 'range' && e.target.type !== 'search') e.target.select(); });
  document.addEventListener('focusout', (e) => {
    const el = e.target; if (!el.dataset || el.dataset.in !== 'gramos') return;
    const it = S.plato.items[+el.dataset.i]; if (it) el.value = it.gramos;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') cierra();
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur();
  });

  /* El marco de la app nunca se desplaza (el foco en un campo oculto no debe mover la pantalla) */
  const marco = $('#app');
  marco.addEventListener('scroll', () => { if (marco.scrollTop) marco.scrollTop = 0; });
  window.addEventListener('scroll', () => { if (window.scrollY) window.scrollTo(0, 0); });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (tGuardar) guardaYa(); return; }
    if (!S.plato.items.length) platoTocado = false;
    if (pestana === 'plato') pintaPlato(); else if (pestana === 'hoy') pintaHoy();
  });

  /* ── Arranque ──────────────────────────────────── */
  if ((S.v || 1) < 2) {                           // guardado por la versión anterior, que abría en «pongo los gramos»
    S.v = 2;
    const P = S.plato;
    if (!P.cambia) {                              // un plato propio a medias no se pierde ni se recalcula: pasa a «Mis platos»
      if (P.items.length && !P.ejemplo) S.platos.unshift({ nombre: 'Lo que tenías en el plato', items: P.items.map((it) => ({ id: it.id, gramos: it.gramos })) });
      nuevoPlato();
    }
    guardar();
  }
  aplicaAspecto();
  pintaBiblio();
  irA('plato');
})();

</script>
